server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: geoverity-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# GeoVerity Cryptography & Security Configuration
geoverity:
  security:
    admin-api-key: ${ADMIN_API_KEY:gv_admin_master_secret_key_884920}
    ecdsa-key-directory: ${ECDSA_KEY_DIR:./keys}
    online-time-tolerance-ms: 5000 # 5 seconds
    offline-max-time-deviation-ms: 120000 # 2 minutes (120 seconds)
    token-validity-seconds: 60
    app-name: GeoVerity
    app-version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
