spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/geoverity}
    username: ${DATABASE_USERNAME:geoverity}
    password: ${DATABASE_PASSWORD:geoverity_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
